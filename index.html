<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141237">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SkyWizard</title>
<meta name="apple-mobile-web-app-title" content="SkyWizard">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<style>
/* SkyWizard theme: night sky, glowing canopy, gold stars */
:root{
  --bg:#141237; --bg2:#231a5c; --glowA:rgba(122,84,230,.38); --glowB:rgba(47,110,210,.35); --glowC:rgba(255,138,92,.10);
  --surface:rgba(255,255,255,.055); --surface2:rgba(255,255,255,.09); --line:rgba(160,180,255,.16);
  --ink:#eef0ff; --muted:#a7a6d6; --deep:#5fd4ff; --onDeep:#141237;
  --cyan:#5fd4ff; --onCyan:#141237; --violet:#9b7bff; --coral:#ff8a5c; --gold:#ffd36e;
  --good:#52e5b8; --maybe:#ffc65c; --poor:#ff7c92;
  --sector:rgba(95,212,255,.28); --sector2:#5fd4ff; --arrow:#ffb36b; --dialbg:rgba(20,18,55,.75);
  --star:rgba(255,255,255,.55); --focus:#ffd36e; --card:#1e1950;
  --wing:linear-gradient(100deg,#5fd4ff 0%,#7f8cff 38%,#b07bff 60%,#ff8a5c 100%);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#efecff; --bg2:#e4ddff; --glowA:rgba(155,123,255,.25); --glowB:rgba(95,180,255,.25); --glowC:rgba(255,150,100,.18);
    --surface:rgba(255,255,255,.62); --surface2:rgba(255,255,255,.85); --line:rgba(70,60,160,.14);
    --ink:#211a57; --muted:#5f5a93; --deep:#3b2fa0; --onDeep:#fff;
    --cyan:#0e8fc2; --onCyan:#ffffff; --violet:#6a4fd8; --coral:#e2603a; --gold:#c98a00;
    --good:#11876a; --maybe:#b37700; --poor:#cc3f5c;
    --sector:rgba(14,143,194,.22); --sector2:#2a8fcf; --arrow:#e2603a; --dialbg:rgba(255,255,255,.85);
    --star:rgba(90,70,200,.25); --focus:#6a4fd8; --card:#fbfaff;
    color-scheme:light;
  }
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Nunito Sans",system-ui,sans-serif;font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;
  background:
    radial-gradient(1.2px 1.2px at 12% 18%,var(--star) 50%,transparent 51%),
    radial-gradient(1px 1px at 78% 9%,var(--star) 50%,transparent 51%),
    radial-gradient(1.4px 1.4px at 64% 34%,var(--star) 50%,transparent 51%),
    radial-gradient(1px 1px at 30% 52%,var(--star) 50%,transparent 51%),
    radial-gradient(1.2px 1.2px at 88% 61%,var(--star) 50%,transparent 51%),
    radial-gradient(1px 1px at 8% 80%,var(--star) 50%,transparent 51%),
    radial-gradient(1.3px 1.3px at 47% 88%,var(--star) 50%,transparent 51%),
    radial-gradient(60% 45% at 15% 100%,var(--glowA),transparent 70%),
    radial-gradient(55% 40% at 95% 70%,var(--glowB),transparent 70%),
    radial-gradient(50% 30% at 70% 0%,var(--glowC),transparent 70%),
    linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);
  background-attachment:fixed}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-family:Fredoka,"Nunito Sans",sans-serif;font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 78%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;border-bottom:1px solid var(--line)}
.brand{font-family:Fredoka,sans-serif;font-weight:600;font-size:1.15rem;letter-spacing:.01em;margin:0 0 4px;display:flex;align-items:center;gap:6px}
.brand span{color:var(--cyan)}
.brand svg{width:16px;height:16px;color:var(--gold)}
.top{display:flex;align-items:center;gap:8px}
.days{display:flex;gap:4px;flex:1;overflow-x:auto}
.day{border:0;background:transparent;padding:6px 12px;border-radius:999px;font-family:Fredoka,sans-serif;font-weight:500;font-size:1.05rem;color:var(--muted);white-space:nowrap}
.day[aria-pressed=true]{background:var(--cyan);color:var(--onCyan);font-weight:600}
.icon{border:1px solid var(--line);background:var(--surface);border-radius:50%;width:38px;height:38px;display:grid;place-items:center;flex:none;color:var(--ink)}
.icon svg{width:18px;height:18px}
.where{margin-top:6px;font-size:.85rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
main{padding:10px 0 80px;max-width:720px;margin:0 auto}
.status{padding:28px 20px;color:var(--muted)}
.status h2{font-family:Fredoka,sans-serif;font-weight:600;font-size:1.6rem;color:var(--ink);margin:0 0 6px}
.status .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:999px;font-weight:600}
.btn.primary{background:var(--cyan);color:var(--onCyan);border-color:transparent}
.site{display:grid;grid-template-columns:52px 1fr auto;gap:4px 12px;align-items:center;padding:14px 16px;border:0;border-bottom:1px solid var(--line);background:transparent;width:100%;text-align:left}
.site:active{background:var(--surface)}
.site .name{font-family:Fredoka,sans-serif;font-weight:500;font-size:1.1rem;line-height:1.2}
.site .sub{font-size:.88rem;color:var(--muted)}
.site .facts{grid-column:2/4;font-size:.85rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 12px}
.score{font-family:Fredoka,sans-serif;font-weight:600;font-size:1.75rem;line-height:1;min-width:2ch;text-align:right}
.score small{display:block;font-family:"Nunito Sans",sans-serif;font-weight:700;font-size:.7rem;text-align:right;letter-spacing:.02em}
.g{color:var(--good)} .m{color:var(--maybe)} .p{color:var(--poor)}
.score.g{text-shadow:0 0 18px color-mix(in srgb,var(--good) 55%,transparent)}
/* the hero: best site, framed like a glowing canopy */
.best{position:relative;margin:4px 12px 14px;width:calc(100% - 24px);padding:18px 16px 16px;grid-template-columns:72px 1fr auto;border-radius:22px;border:0;
  background:radial-gradient(120% 90% at 0% 0%,color-mix(in srgb,var(--cyan) 14%,var(--card)),var(--card) 60%) padding-box,var(--wing) border-box;border:1.5px solid transparent;
  box-shadow:0 10px 40px -12px color-mix(in srgb,var(--violet) 60%,transparent),0 0 0 1px rgba(255,255,255,.02)}
.best::before{content:"Best bet";position:absolute;top:-10px;left:18px;font-family:Fredoka,sans-serif;font-size:.78rem;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--cyan);color:var(--onCyan)}
.best .name{font-size:1.7rem;font-weight:600;line-height:1.05}
.best .score{font-size:2.8rem}
.best .why{grid-column:1/4;margin:6px 0 0;font-size:.95rem}
.strip{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin-top:6px}
.strip i{height:8px;border-radius:999px;background:var(--line)}
.strip i.g{background:var(--good);box-shadow:0 0 8px color-mix(in srgb,var(--good) 70%,transparent)}
.strip i.m{background:var(--maybe)}
.strip i.p{background:var(--poor);opacity:.5}
.striphours{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;font-size:.62rem;line-height:1.2;color:var(--muted);text-align:center;margin-top:3px;font-variant-numeric:tabular-nums}
.striphours b{font-weight:800;color:var(--ink)}
.locbtn{border:0;background:transparent;padding:0;color:var(--cyan);font-weight:700;display:inline-flex;align-items:center;gap:4px;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.locbtn svg{width:13px;height:13px}
.section{padding:6px 16px 4px;font-family:Fredoka,sans-serif;font-weight:500;color:var(--muted);font-size:1rem}
/* sheets */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);background-image:radial-gradient(60% 40% at 10% 100%,var(--glowA),transparent 70%),radial-gradient(50% 35% at 100% 20%,var(--glowB),transparent 70%),linear-gradient(180deg,var(--bg),var(--bg2));overflow-y:auto;transform:translateY(100%);transition:transform .25s ease;padding-bottom:40px}
.sheet.open{transform:none}
@media (prefers-reduced-motion: reduce){.sheet{transition:none}}
.sheethead{position:sticky;top:0;background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;border-bottom:1px solid var(--line);z-index:2}
.sheethead h2{flex:1;margin:0;font-family:Fredoka,sans-serif;font-weight:600;font-size:1.45rem;line-height:1.1}
.pad{padding:14px 16px;max-width:720px;margin:0 auto}
.pad p{margin:0 0 10px}
.warn{border-left:3px solid var(--gold);padding:4px 0 4px 10px;margin:8px 0;font-size:.93rem;background:linear-gradient(90deg,color-mix(in srgb,var(--gold) 10%,transparent),transparent);border-radius:0 8px 8px 0}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{padding:7px 8px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th+th,td+td{border-left:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
th{font-weight:600;color:var(--muted);font-size:.78rem}
td.sc{font-family:Fredoka,sans-serif;font-weight:600;font-size:1rem}
.tablewrap{overflow-x:auto;margin:6px -16px;padding:0 16px}
.mapframe{width:100%;height:220px;border:1px solid var(--line);border-radius:16px;margin:10px 0}
.links{display:flex;flex-wrap:wrap;gap:8px 14px;margin:6px 0 12px}
.links a{color:var(--cyan);font-weight:700}
dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;font-size:.9rem;margin:8px 0}
dt{color:var(--muted)}
dd{margin:0}
label.field{display:block;margin:12px 0}
label.field span{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
select,input[type=text],input[type=number],textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
select option{color:#211a57}
.compass{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.compass button{padding:8px 0;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-family:Fredoka,sans-serif;font-weight:500}
.compass button[data-r="1"]{background:var(--sector)}
.compass button[data-r="2"]{background:var(--sector2);color:#141237}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.9rem}
.chip[aria-pressed=true]{background:var(--cyan);color:var(--onCyan);border-color:transparent}
.results{margin-top:6px}
.results button{display:block;width:100%;text-align:left;padding:10px 10px;border:0;border-bottom:1px solid var(--line);background:transparent}
.small{font-size:.82rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--cyan);color:var(--onCyan);font-weight:700;padding:9px 18px;border-radius:999px;z-index:40;font-size:.9rem;display:none}

/* detail: sounding + pilot data */
tbody tr{cursor:pointer}
tbody tr.sel td{background:color-mix(in srgb,var(--cyan) 14%,transparent)}
.hint{font-size:.78rem;color:var(--muted);margin:4px 0 0}
.panel{margin:18px 0 6px}
.panel h3{font-family:Fredoka,sans-serif;font-weight:600;font-size:1.2rem;margin:0 0 2px}
.snd{width:100%;height:auto;display:block;margin-top:6px}
details.xc{border:1px solid var(--line);border-radius:16px;background:var(--surface);margin:10px 0;overflow:hidden}
details.xc summary{list-style:none;cursor:pointer;padding:13px 14px;display:flex;align-items:center;gap:10px;font-family:Fredoka,sans-serif;font-weight:500;font-size:1.05rem}
details.xc summary::-webkit-details-marker{display:none}
details.xc summary .val{margin-left:auto;font-family:"Nunito Sans",sans-serif;font-weight:800;font-size:.95rem}
details.xc summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-left:6px;transition:transform .2s}
details.xc[open] summary::after{transform:rotate(-135deg)}
details.xc .in{padding:0 14px 14px}
details.xc .what{font-size:.88rem;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.altrow{display:flex;gap:10px;align-items:center;margin:6px 0 10px}
.altrow input[type=range]{flex:1;accent-color:var(--cyan);height:28px}
.altrow input[type=number]{width:96px;flex:none}
.readout{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.readout div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.readout b{display:block;font-family:Fredoka,sans-serif;font-weight:600;font-size:1.15rem}
.readout span{font-size:.75rem;color:var(--muted)}
.star{color:var(--gold);font-weight:800;margin-left:1px}
.adj{display:inline-block;margin-left:8px;padding:0 8px;border-radius:999px;font-size:.72rem;font-weight:700;line-height:1.6;color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 55%,transparent);vertical-align:1px}
</style>
</head>
<body>
<header>
  <div class="brand" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.2 6.6L21 11l-6.8 2.4L12 20l-2.2-6.6L3 11l6.8-2.4z"/></svg><span>SkyWizard</span></div>
  <div class="top">
    <div class="days" id="days" role="group" aria-label="Forecast day"></div>
    <button class="icon" id="refreshBtn" aria-label="Refresh forecast"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
    <button class="icon" id="settingsBtn" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
  <div class="where" id="where"></div>
</header>
<main id="main"><div class="status"><h2>Checking the sky</h2><p>Getting your location…</p></div></main>

<section class="sheet" id="detail" aria-modal="true" role="dialog" aria-labelledby="dTitle">
  <div class="sheethead"><button class="icon" data-close aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button><h2 id="dTitle"></h2><div id="dScore" class="score"></div></div>
  <div class="pad" id="dBody"></div>
</section>

<section class="sheet" id="settings" aria-modal="true" role="dialog" aria-labelledby="sTitle">
  <div class="sheethead"><button class="icon" data-close aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button><h2 id="sTitle">Settings</h2></div>
  <div class="pad" id="sBody"></div>
</section>

<section class="sheet" id="editor" aria-modal="true" role="dialog" aria-labelledby="eTitle">
  <div class="sheethead"><button class="icon" data-close aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button><h2 id="eTitle">Edit site</h2></div>
  <div class="pad" id="eBody"></div>
</section>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
/* ============================================================
   SkyWizard — paragliding site ranker
   Data: curated club-guide sites + BHGC site database (GitHub)
         + Paragliding Earth API + OpenStreetMap takeoffs
   Weather: Open-Meteo (HRRR/GFS blend), terrain: Open-Meteo elevation
   ============================================================ */

const DIRS=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
const KMH_PER_MPH=1.609344, FT_PER_M=3.28084;
const BHGC_URL='https://raw.githubusercontent.com/BHGC/website/master/content/sites/sites.dcf';

/* ---------- Curated sites (researched from club guides) ----------
   dirs: rating per compass point, 2 = good, 1 = workable
   wind.mph: [min, ideal low, ideal high, max] for launching paragliders
   dirSrc tells the user how trustworthy the directions are */
const CURATED=[
 {name:'Ed Levin, 1750 launch',lat:37.475389,lon:-121.861305,altFt:2150,types:['thermal','ridge'],
  dirs:{S:1,SSW:1,SW:2,WSW:2,W:2,WNW:2,NW:1},dirSrc:'Wings of Rogallo site guide',
  note:'Wind is often light S in the morning, strengthening and clocking to WNW by early afternoon. Watch for rotor behind trees in S–SE wind. A SE-facing back launch works in light SE (under ~8 mph).',
  req:'P3, or P2 with 4 flights from 500 ft+ and a site intro',url:'https://wingsofrogallo.org/ed-levin'},
 {name:'Ed Levin, 600 launch',lat:37.461324,lon:-121.859979,altFt:1000,types:['thermal','ridge'],

  req:'P3, or P2 with 3 flights from 300 ft+ and a site intro',url:'https://wingsofrogallo.org/ed-levin'},
 {name:'Mission Ridge',lat:37.517534,lon:-121.89175,altFt:1900,types:['thermal','ridge'],dirs:null,
  note:'Not advised in strong wind. Daily electronic sign-in required.',req:'P4, or P3 with required skills and signoff',url:'https://wingsofrogallo.org/?p=2294'},
 {name:'Mount Tamalpais',lat:37.911167,lon:-122.624422,altFt:1950,types:['thermal','ridge'],
  dirs:{S:1,SSW:2,SW:2,WSW:2,W:2,WNW:1},dirSrc:'MCHGA / flyappi site guide',
  note:'S to WNW. Often best late fall to early spring around fronts; summer is often stable or foggy. B launch can hide a north component, so check the sock at the top. Land at the designated Stinson LZ, never near the water.',
  req:'P3 with MCHGA sticker',url:'https://flyappi.org/flysite/1269'},
 {name:'Mount Diablo, West/Juniper',lat:37.87787,lon:-121.934436,altFt:2880,types:['thermal'],
  dirs:{SW:2,WSW:2,W:2},wind:{mph:[0,3,10,20]},dirSrc:'Wings of Rogallo site guide',
  note:'Paraglider winds: ideal ~7 mph, max 20 mph. Risk of rotor and shear right in front of launch; don\u2019t thermal close to launch.',req:'P4 (WOR)',url:'https://wingsofrogallo.org/mt-diablo'},
 {name:'Mount Diablo, Towers',lat:37.882018,lon:-121.919003,altFt:3600,types:['thermal'],
  dirs:{NW:2,NNW:2,N:2,NNE:2,NE:2},wind:{mph:[3,4,7,10]},dirSrc:'Wings of Rogallo site guide',
  note:'Most sensitive launch: must be accompanied by a site committee member, max 5 gliders on launch. 6:1 glide to Mitchell Canyon.',req:'P4 (WOR)',url:'https://wingsofrogallo.org/mt-diablo'},
 {name:'Mount Diablo, South',lat:37.878612,lon:-121.920345,altFt:3575,types:['thermal'],
  dirs:{S:2,SSE:2,SE:2,ESE:2},wind:{mph:[3,4,7,10]},dirSrc:'Wings of Rogallo site guide',
  note:'Paraglider winds 3–10 mph. Glide to Curry Point LZ about 5.6:1.',req:'P4 (WOR)',url:'https://wingsofrogallo.org/mt-diablo'},
 {name:'Mussel Rock (The Dumps)',lat:37.672728,lon:-122.493688,altFt:230,types:['coastal'],
  dirs:{WSW:1,W:2,WNW:2,NW:2,NNW:1},wind:{mph:[9,12,20,25]},dirSrc:'estimated from cliff orientation, please confirm',
  note:'Paragliding only. Strong cliff updrafts; keep clear of the cliff face.',req:'P2–P3'},
 {name:'The Stables',lat:37.7018995,lon:-122.4998547,altFt:60,types:['coastal'],

/* direction ratings: object {W:2,...} or 16-array -> 16-array */
function dirsToArr(d){
  if(!d)return null;
  if(Array.isArray(d))return d.slice();
  const a=new Array(16).fill(0);
  for(const[k,v]of Object.entries(d)){const i=DIRS.indexOf(k);if(i>=0)a[i]=v}
  return a;
}
function listToArr(list){ // ['SW','W'] -> listed=2, neighbours=1
  const a=new Array(16).fill(0);let any=false;
  list.forEach(s=>{const i=DIRS.indexOf(s);if(i>=0){a[i]=2;any=true}});
  if(!any)return null;
  for(let i=0;i<16;i++)if(a[i]===2){[-1,1].forEach(o=>{const j=(i+o+16)%16;if(!a[j])a[j]=1})}
  return a;
}
function dirMatch(arr,wd){
  if(!arr)return 0.6; // unknown orientation
  let m=0;
  for(let i=0;i<16;i++){if(!arr[i])continue;const diff=angDiff(wd,i*22.5);const f=diff<=11.25?1:diff>=45?0:1-(diff-11.25)/33.75;m=Math.max(m,(arr[i]===2?1:0.7)*f)}
  return m;
}
function dirsText(arr){
  if(!arr)return 'unknown';
  const good=DIRS.filter((d,i)=>arr[i]===2);
  return good.length?good.join(', '):DIRS.filter((d,i)=>arr[i]).join(', ');
}

async function bhgcSites(){
  const cached=store.get('bhgc',null);
  let txt=null;
  if(cached&&Date.now()-cached.t<7*864e5)txt=cached.txt;
  else{try{txt=await fetchText(BHGC_URL,10000);store.set('bhgc',{t:Date.now(),txt})}catch(e){if(cached)txt=cached.txt;else throw e}}
  const out=[];
  for(const block of txt.split(/\n\s*\n/)){
    if(!/^Name:/m.test(block))continue;
    const f={};block.split('\n').forEach(l=>{const m=l.match(/^(\w+):\s?(.*)$/);if(m)f[m[1]]=m[2].trim()});
    if(/no paragliding/i.test(f.Notes||''))continue;
    const launches=[];const re=/(?:'([^']*)'\s*=\s*)?\(\s*([-\d.]+)\s*,\s*([-\d.]+)\s*(?:,\s*([\dNA.]+))?\s*\)/g;let m;
    while((m=re.exec(f.LaunchGPS||''))){launches.push({label:m[1]||'',lat:+m[2],lon:+m[3],altFt:m[4]&&m[4]!=='NA'?+m[4]:null})}
    if(!launches.length)continue;
    const L=launches.reduce((a,b)=>(b.altFt||0)>(a.altFt||0)?b:a,launches[0]);
    let dirs=null;
    if(f.WindDirections){const toks=f.WindDirections.replace(/'[^']*'=/g,'').toUpperCase().split(/[^A-Z]+/).filter(Boolean);dirs=listToArr(toks)}
    const alt=L.altFt?L.altFt/FT_PER_M:null;
    const notes=(f.Notes||'').replace(/^"|"$/g,'').replace(/\[([^\]]+)\]\([^)]+\)/g,'$1');
    const others=launches.filter(x=>x!==L&&x.altFt&&L.altFt&&x.altFt<L.altFt-80&&distKm(x.lat,x.lon,L.lat,L.lon)<3).map(x=>({name:(x.label?x.label.replace(/\/.*$/,'').replace(/^./,c=>c.toUpperCase())+' launch':'Lower launch'),alt:x.altFt/FT_PER_M}));
    out.push({id:'b-'+slug(f.Name),name:f.Name,lat:L.lat,lon:L.lon,alt,types:null,dirs,dirSrc:dirs?'BHGC':null,others,
      note:notes,req:(f.Requirements||'').trim(),url:f.OfficialURL||'',source:'BHGC site database'});
  }
  return out;
}

async function pgeSites(lat,lon,km){

  const j=await fetchJSON(url,{},7000);
  const feats=j.features||[];
  return feats.map(ft=>{
    const p=ft.properties||{},c=ft.geometry&&ft.geometry.coordinates;if(!c)return null;
    if(p.paragliding!==undefined&&+p.paragliding===0)return null;
    const map={N:0,NE:2,E:4,SE:6,S:8,SW:10,W:12,NW:14};const a=new Array(16).fill(0);let any=false;
    for(const[k,i]of Object.entries(map)){const v=+(p[k]??p[k.toLowerCase()]??0);if(v>0){a[i]=Math.max(a[i],v>=2?2:1);any=true}}
    if(any)for(const i of[0,2,4,6,8,10,12,14]){if(a[i]){const n1=(i+1)%16,n2=(i+15)%16;a[n1]=Math.max(a[n1],Math.min(a[i],a[(i+2)%16])||1);a[n2]=Math.max(a[n2],Math.min(a[i],a[(i+14)%16])||1)}}
    const types=[];if(+p.thermals)types.push('thermal');if(+p.soaring)types.push('ridge');
    const alt=+p.takeoff_altitude||null;
    return {id:'p-'+(p.pge_site_id||p.id||slug(p.name||'')),name:p.name||'Unnamed site',lat:c[1],lon:c[0],alt,types:types.length?types:null,
      dirs:any?a:null,dirSrc:any?'Paragliding Earth':null,note:'',req:'',url:p.pge_link||'',source:'Paragliding Earth'};
  }).filter(Boolean);
}

function parseOsmDir(s){
  if(!s)return null;const a=new Array(16).fill(0);let any=false;
  const toDeg=t=>{t=t.trim().toUpperCase();if(/^\d+(\.\d+)?$/.test(t))return +t;const i=DIRS.indexOf(t);return i>=0?i*22.5:null};
  for(const part of s.split(/[;,]/)){
    const r=part.split('-');
    if(r.length===2){const A=toDeg(r[0]),B=toDeg(r[1]);if(A==null||B==null)continue;let span=((B-A)%360+360)%360;for(let x=0;x<=span;x+=22.5){a[Math.round((A+x)/22.5)%16]=2;any=true}}
    else{const D=toDeg(part);if(D!=null){a[Math.round(D/22.5)%16]=2;any=true}}
  }
  if(!any)return null;
  for(let i=0;i<16;i++)if(a[i]===2)[-1,1].forEach(o=>{const j=(i+o+16)%16;if(!a[j])a[j]=1});
  return a;
}
async function osmSites(lat,lon,km){

  return (j.elements||[]).map(e=>{
    const t=e.tags||{};if(t['free_flying:paragliding']==='no')return null;

      note:t.description||'',req:'',url:t.website||'',source:'OpenStreetMap'};
  }).filter(Boolean);
}

/* fill missing altitude and launch direction from terrain */
async function fillTerrain(sites){
  // samples terrain around each launch: a 300 m ring (which way the slope faces) and a 1.5 km ring
  // (how far the launch stands above its surroundings, used for ridge-top wind speed-up)
  const cache=store.get('terrain2',{});
  const need=sites.filter(s=>!cache[s.id]);
  const angles=[0,45,90,135,180,225,270,315];
  const ring=(s,R)=>angles.map(a=>[s.lat+R*Math.cos(rad(a))/111320,s.lon+R*Math.sin(rad(a))/(111320*Math.cos(rad(s.lat)))]);
  for(let i=0;i<need.length;i+=5){
    const chunk=need.slice(i,i+5);const pts=[];
    chunk.forEach(s=>{pts.push([s.lat,s.lon],...ring(s,300),...ring(s,1500))});
    try{
      const j=await fetchJSON(`https://api.open-meteo.com/v1/elevation?latitude=${pts.map(p=>p[0].toFixed(5)).join(',')}&longitude=${pts.map(p=>p[1].toFixed(5)).join(',')}`);
      chunk.forEach((s,k)=>{
        const e=j.elevation.slice(k*17,k*17+17);const e0=e[0];let x=0,y=0,drop=0;
        angles.forEach((a,n)=>{const d=e0-e[n+1];if(d>0){x+=d*Math.sin(rad(a));y+=d*Math.cos(rad(a))}drop+=Math.max(0,d)});
        const slope=drop/8/300;const face=(deg(Math.atan2(x,y))+360)%360;
        const far=e.slice(9,17).sort((p,q)=>p-q);const around=(far[3]+far[4])/2;
        cache[s.id]={alt:e0,face:slope>0.06?face:null,slope,around};
      });
    }catch(e){console.warn('terrain',e)}
  }
  store.set('terrain2',cache);
  sites.forEach(s=>{const c=cache[s.id];if(!c)return;
    if(s.alt==null)s.alt=c.alt;
    s.prom=clamp((s.alt??c.alt)-c.around,0,700); // height of launch above the surrounding terrain
    if(!s.dirs&&c.face!=null){const i=Math.round(c.face/22.5)%16;const a=new Array(16).fill(0);a[i]=2;a[(i+1)%16]=2;a[(i+15)%16]=2;a[(i+2)%16]=1;a[(i+14)%16]=1;s.dirs=a;s.dirSrc='estimated from terrain (slope faces '+DIRS[i]+'), please confirm';s.face=c.face}
  });
}

function guessTypes(s){
  if(s.types&&s.types.length)return s.types;
  const txt=s.name+' '+(s.note||'');
  if(s.alt!=null&&s.alt<150&&/beach|coast|bluff|cliff|dune|ocean|sea\b|point/i.test(txt))return['coastal'];
  if(s.alt!=null&&s.alt<150)return['ridge'];
  return['thermal','ridge'];
}

let sourceStatus={};
async function gatherSites(lat,lon,km){
  const all=[];const add=list=>{for(const s of list){
    if(BLOCKLIST.some(r=>r.test(s.name)))continue;
    if(distKm(lat,lon,s.lat,s.lon)>km)continue;
    if(all.some(t=>{const d=distKm(t.lat,t.lon,s.lat,s.lon);return d<1.2||(d<6&&t.source!==s.source&&nameKey(t.name)===nameKey(s.name))}))continue;
    all.push(s)}};
  add(curatedSites());sourceStatus['Club guides']='ok';
  add(customSites.map(s=>Object.assign({},s,{dirs:dirsToArr(s.dirs)})));
  const jobs=[
    ['BHGC site database',bhgcSites()],
    ['Paragliding Earth',pgeSites(lat,lon,km)],
    ['OpenStreetMap',osmSites(lat,lon,km)],
  ];
  const res=await Promise.allSettled(jobs.map(j=>j[1]));
  res.forEach((r,i)=>{const name=jobs[i][0];if(r.status==='fulfilled'){sourceStatus[name]=r.value.length?'ok':'no sites here';add(r.value)}else{sourceStatus[name]='unavailable';console.warn(name,r.reason)}});
  // apply user overrides
  for(const s of all){const o=overrides[s.id];if(!o)continue;
    if(o.dirs){s.dirs=o.dirs.slice();s.dirSrc='your edit'}
    if(o.types)s.types=o.types;if(o.note)s.userNote=o.note;if(o.hidden)s.hidden=true}
  all.sort((a,b)=>distKm(lat,lon,a.lat,a.lon)-distKm(lat,lon,b.lat,b.lon));
  const list=all.filter(s=>!s.hidden).slice(0,settings.maxSites);
  await fillTerrain(list);
  list.forEach(s=>{s.types=guessTypes(s);s.km=distKm(lat,lon,s.lat,s.lon)});
  return list;
}

const LEVELS=[1000,975,950,925,900,850,800,750,700,650,600,550,500];
const SURF=['temperature_2m','dew_point_2m','wind_speed_10m','wind_direction_10m','wind_gusts_10m','cloud_cover','precipitation_probability','cape','lifted_index','shortwave_radiation','is_day','boundary_layer_height','sensible_heat_flux','wind_speed_80m','wind_direction_80m','wind_speed_120m','wind_direction_120m','wind_speed_180m','wind_direction_180m'];
const LV=[];LEVELS.forEach(p=>['temperature','geopotential_height','wind_speed','wind_direction','relative_humidity'].forEach(v=>LV.push(`${v}_${p}hPa`)));
const TZ='auto'; // each site's own local time

async function fetchWeather(sites,onProgress){
  const B=20;
  for(let i=0;i<sites.length;i+=B){
    const ch=sites.slice(i,i+B);
    onProgress&&onProgress(i,sites.length);
    const url='https://api.open-meteo.com/v1/forecast?latitude='+ch.map(s=>s.lat.toFixed(4)).join(',')+
      '&longitude='+ch.map(s=>s.lon.toFixed(4)).join(',')+'&elevation='+ch.map(s=>Math.round(s.alt??0)).join(',')+
      '&hourly='+SURF.concat(LV).join(',')+'&forecast_days=3&wind_speed_unit=kmh&timezone='+encodeURIComponent(TZ);
    const j=await fetchJSON(url,{},25000);

    arr.forEach((loc,k)=>{ch[k].wx=loc.hourly;if(ch[k].alt==null)ch[k].alt=loc.elevation});
  }
}

/* interpolate along a profile [{z,T,u,v}] */
function interp(prof,z,key){
  if(z<=prof[0].z)return prof[0][key];
  for(let i=1;i<prof.length;i++)if(z<=prof[i].z){const a=prof[i-1],b=prof[i];const f=(z-a.z)/(b.z-a.z);return a[key]+f*(b[key]-a[key])}
  return prof[prof.length-1][key];
}
const dewFromRH=(T,rh)=>{const a=17.62,b=243.12,g=Math.log(Math.max(rh,1)/100)+a*T/(b+T);return b*g/(a-g)};
const toUV=(s,d)=>({u:-s*Math.sin(rad(d)),v:-s*Math.cos(rad(d))});
const fromUV=(u,v)=>({s:Math.hypot(u,v),d:(deg(Math.atan2(-u,-v))+360)%360});

/* Wind at a launch: the plain model forecast (10 m wind, blended toward the free-air wind for
   high mountain launches). The only adjustment is a pilot's own per-site percentage, if set. */
function launchWind(s,h,i,altL,mult=1){
  const v10=h.wind_speed_10m[i]??0,d10=h.wind_direction_10m[i]??0,g10=h.wind_gusts_10m[i]??v10;
  const a=toUV(v10,d10);const wL=clamp((altL-200)/900,0,0.6);
  let lu=a.u,lv=a.v;
  for(const p of LEVELS){const z=h[`geopotential_height_${p}hPa`][i];if(z!=null&&z>=altL+30){const b=toUV(h[`wind_speed_${p}hPa`][i]??0,h[`wind_direction_${p}hPa`][i]??0);lu=b.u;lv=b.v;break}}
  const w=fromUV(a.u*(1-wL)+lu*wL,a.v*(1-wL)+lv*wL);
  const gust=Math.max(w.s,g10*Math.min(2,Math.max(1,w.s/Math.max(v10,1))));
  return {ws:w.s*mult,wd:w.d,gust:gust*mult};
}

/* physics for one hour at one site */
function analyzeHour(s,h,i){
  const alt=s.alt||0;
  const T2=h.temperature_2m[i],Td=h.dew_point_2m[i];
  const levels=[];
  for(const p of LEVELS){const z=h[`geopotential_height_${p}hPa`][i],T=h[`temperature_${p}hPa`][i],ws=h[`wind_speed_${p}hPa`][i],wd=h[`wind_direction_${p}hPa`][i];
    if(z==null||T==null||z<alt+40)continue;const uv=toUV(ws??0,wd??0);const rh=h[`relative_humidity_${p}hPa`]?h[`relative_humidity_${p}hPa`][i]:null;
    levels.push({z,T,Td:rh?dewFromRH(T,rh):null,u:uv.u,v:uv.v})}
  const g=toUV(h.wind_speed_10m[i]??0,h.wind_direction_10m[i]??0);
  const prof=[{z:alt,T:T2,Td,u:g.u,v:g.v}].concat(levels.sort((a,b)=>a.z-b.z));
  const mult=windMult(s);const lw=launchWind(s,h,i,alt,mult);
  const launch={s:lw.ws,d:lw.wd};const gust=lw.gust;
  const raw=mult!==1?launchWind(s,h,i,alt,1):null;
  const others=(s.others||[]).map(L=>Object.assign({name:L.name,alt:L.alt},launchWind(s,h,i,L.alt,mult)));
  const sw=h.shortwave_radiation[i]||0;
  // parcel ascent: surface parcel with a small trigger excess, dry adiabatic
  const trig=0.5+1.5*clamp(sw/800);
  let top=alt;
  for(let z=alt;z<=alt+5500;z+=25){const Tp=T2+trig-0.0098*(z-alt);if(Tp<=interp(prof,z,'T')){top=z;break}top=z}
  const lcl=alt+125*Math.max(0,T2-Td);
  // Lift height: the model's boundary-layer height (what XC Skies-style "top of lift" uses).
  // Backtests on Ed Levin and Blue Rock XC days showed it predicts good thermal days far better
  // than a simple parcel estimate, so the parcel method is only a fallback when it's missing.
  const blh=h.boundary_layer_height?h.boundary_layer_height[i]:null;
  const parcelDepth=Math.max(0,Math.min(top,lcl)-alt);
  const depth=(blh!=null&&blh>0)?Math.min(blh,3000):parcelDepth;
  const ceiling=alt+depth;const cu=lcl<ceiling;
  const shf=h.sensible_heat_flux?h.sensible_heat_flux[i]:null;
  const heat=Math.max(shf!=null?shf:0,0.3*sw);
  const wstar=Math.cbrt(9.81/(T2+273.15)*(heat/1200)*depth);
  const climb=Math.max(0,1.6*wstar-1.0); // rough core climb rate for display (not used in the score)
  const lapse=depth>200?(T2-interp(prof,ceiling,'T'))/(depth/1000):null;
  const aloft=fromUV(interp(prof,Math.max(ceiling,alt+300),'u'),interp(prof,Math.max(ceiling,alt+300),'v'));
  // buoyancy-to-shear: thermal strength vs how much the wind changes through the lift band
  const lu=toUV(launch.s,launch.d),tu=toUV(aloft.s,aloft.d);
  const shear=Math.hypot(tu.u-lu.u,tu.v-lu.v)/3.6; // m/s
  const bsr=depth>150&&wstar>0.3?10*wstar/Math.max(shear,0.5):0;
  return {raw,snd:prof,trig,bsr,shear,others,T2,Td,sw,top:ceiling,dryTop:top,lcl,cu,depth,wstar,climb,lapse,ws:launch.s,wd:launch.d,gust,aloft,
    cape:h.cape[i]||0,li:h.lifted_index[i]??5,pp:h.precipitation_probability[i]||0,cc:h.cloud_cover[i]||0};
}

const DEFAULT_WIND={thermal:[0,0,13,22],ridge:[12,16,28,35],coastal:[13,18,30,37]};
function speedFit(v,r){ // soft ramp: a few km/h below the minimum shows as marginal, then widens through "maybe"
  const[mn,lo,hi,mx]=r;const soft=Math.max(0,mn-4);
  if(v>mx||v<soft)return 0;
  if(v<mn)return 0.2+0.25*(v-soft)/Math.max(1,mn-soft);
  if(v<lo)return 0.45+0.55*Math.pow((v-mn)/Math.max(1,lo-mn),1.3);
  if(v<=hi)return 1;
  return 1-0.7*(v-hi)/Math.max(1,mx-hi)}
function scoreHour(type,s,a){
  const m=dirMatch(s.dirs,a.wd);
  const fp=a.pp>=60?0.15:a.pp>=35?0.5:a.pp>=20?0.85:1;
  const od=(a.cape>1500||a.li<-4)?0.35:(a.cape>800||a.li<-2)?0.65:a.cape>400?0.85:1;
  const gs=a.gust-a.ws;
  if(type==='thermal'){
    const r=s.wind||DEFAULT_WIND.thermal;const mx=r[3];
    // calibrated on 600+ archived days at Ed Levin and checked on 2 years at Blue Rock:
    // ~250 m of lift is nothing, ~1150 m+ is an XC day
    const base=clamp((a.depth-250)/900)*clamp((a.sw-50)/200); // needs some sun to work
    let fw;
    if(a.ws<=7)fw=(m<0.3&&a.ws>4)?0.7:1;
    else if(a.ws<=mx)fw=m*(1-0.35*(a.ws-7)/Math.max(1,mx-7));
    else fw=Math.max(0,m*0.55*(1-(a.ws-mx)/8));
    const fg=gs<=12?1:clamp(1-(gs-12)/20,0.2,1);
    const fa=a.aloft.s<=25?1:clamp(1-(a.aloft.s-25)/25,0.15,1);
    return {score:100*base*fw*fg*fa*fp*od,m};
  }
  const r=s.wind||DEFAULT_WIND[type];
  if(m<0.35)return {score:0,m};
  const fs=speedFit(a.ws,r);
  const fg=gs<=8?1:clamp(1-(gs-8)/14,0,1);
  return {score:100*fs*Math.pow(m,1.2)*fg*fp*(od<1?0.8+0.2*od:1),m};
}

function analyzeSite(s){
  const h=s.wx;if(!h)return;
  const days={};
  h.time.forEach((t,i)=>{const[d,hm]=t.split('T');const hr=+hm.slice(0,2);(days[d]=days[d]||[]).push({i,hr})});
  s.days={};
  // less trust in sites whose launch direction is guessed
  const conf=!s.dirs?0.7:/estimated/.test(s.dirSrc||'')?0.85:1;
  for(const[d,hours]of Object.entries(days)){
    const fly=hours.filter(x=>x.hr>=7&&x.hr<=20&&h.is_day[x.i]===1);
    const rows=fly.map(x=>{const a=analyzeHour(s,h,x.i);a.hr=x.hr;a.scores={};s.types.forEach(t=>a.scores[t]=scoreHour(t,s,a).score*conf);if(a.raw){const ar=Object.assign({},a,{ws:a.raw.ws,wd:a.raw.wd,gust:a.raw.gust});a.rawScores={};s.types.forEach(t=>a.rawScores[t]=scoreHour(t,s,ar).score*conf)}a.best=Math.max(...Object.values(a.scores));return a});
    let bestType=null,bestVal=-1,bestPeak=null;
    for(const t of s.types){
      const v=rows.map(r=>r.scores[t]);let b=-1,bi=0;
      for(let k=0;k<v.length;k++){const w=v.slice(Math.max(0,k-1),k+2);const mean=w.reduce((p,c)=>p+c,0)/w.length;if(mean>b){b=mean;bi=k}}
      if(b>bestVal){bestVal=b;bestType=t;bestPeak=bi}
    }
    const v=rows.map(r=>r.scores[bestType]);const peak=Math.max(...v);const pk=v.indexOf(peak);
    let lo=pk,hi=pk;const thr=Math.max(35,peak*0.7);
    while(lo>0&&v[lo-1]>=thr)lo--;while(hi<v.length-1&&v[hi+1]>=thr)hi++;
    s.days[d]={score:Math.round(bestVal),type:bestType,rows,peak:rows[pk],win:peak>=35?[rows[lo].hr,rows[hi].hr+1]:null};
  }
}

/* plain-language reasons */
const TYPE_LABEL={thermal:'Thermal',ridge:'Ridge soaring',coastal:'Coastal soaring'};
function reasons(s,day){
  const p=day.peak,t=day.type,out=[],warn=[];
  const win=day.win?`${hourLabel(day.win[0])}–${hourLabel(day.win[1])}`:null;
  const onLaunch=dirMatch(s.dirs,p.wd);
  const dirWord=!s.dirs?'':onLaunch>=0.8?', straight in':onLaunch>=0.5?', a bit crossed':onLaunch>0.1?', well crossed':', not on launch';
  if(t==='thermal'){
    if(p.depth<150)out.push(`Lift looks capped near launch height, so thermals will be weak or absent.`);
    else out.push(`${day.score>=65?'Good':day.score>=40?'Possible':'Weak'} thermal day: climbs around ${U.climb(p.climb)} up to about ${U.altN(p.top)} (${U.altN(p.depth)} over launch)${win?' from '+win:''}.`);
    out.push(`Launch wind ${U.spd(p.ws)} ${dirName(p.wd)}${dirWord}. ${p.cu?`Cumulus likely, base near ${U.altN(p.lcl)}.`:'Probably blue, no cumulus.'}${p.lapse?` Lapse rate about ${p.lapse.toFixed(1)}°C per km.`:''}`);
    if(p.aloft.s>25)warn.push(`Wind at the top of lift ${U.spd(p.aloft.s)} ${dirName(p.aloft.d)}, so expect broken, drifting thermals.`);
  }else{
    const r=s.wind||DEFAULT_WIND[t];
    out.push(`${day.score>=65?'Good':day.score>=40?'Possible':'Unlikely'} ${t==='coastal'?'coastal':'ridge'} day: ${U.spd(p.ws)} ${dirName(p.wd)} onto a launch that works in ${dirsText(s.dirs)}${win?', best '+win:''}.`);
    if(p.ws<r[0])out.push(`That\u2019s below the ~${U.spd(r[0])} needed to stay up.`);
    else if(p.ws>r[3])out.push(`That\u2019s above the ~${U.spd(r[3])} limit for this site.`);
    else out.push(`Ideal here is roughly ${U.spd(r[1])} to ${U.spd(r[2])}.`);
    if(p.climb>=0.3)out.push(`Thermals add climbs of ~${U.climb(p.climb)} to ${U.altN(p.top)}.`);
  }
  if(p.gust-p.ws>10)warn.push(`Gusty: gusts to ${U.spd(p.gust)}.`);
  if(p.cape>800||p.li<-2)warn.push(`Unstable air (CAPE ${Math.round(p.cape)} J/kg): watch for overdevelopment and storms.`);
  else if(p.cape>400)warn.push(`Some instability (CAPE ${Math.round(p.cape)} J/kg); keep an eye on cloud growth.`);
  if(p.pp>=30)warn.push(`${p.pp}% chance of rain around the best hour.`);
  if(p.T2-p.Td<=1.7)warn.push(`Fog or low cloud possible at launch: temperature only ${settings.units==='us'?Math.round((p.T2-p.Td)*1.8)+'°F':Math.round(p.T2-p.Td)+'°C'} above the dewpoint around the best hour.`);
  if(!s.dirs)warn.push(`Launch direction unknown, so wind direction wasn\u2019t judged. Tap Edit to set it.`);
  else if(/estimated|please confirm/.test(s.dirSrc||''))warn.push(`Launch directions are ${s.dirSrc.replace(/, please confirm/,'')}. Tap Edit if they\u2019re wrong.`);
  return {out,warn};
}

let SITES=[],DAYKEYS=[],curDay=null,loading=false;
const cls=v=>v>=65?'g':v>=40?'m':'p';
const disp=v=>Math.max(1,Math.min(10,Math.round(v/10))); // show 1–10, rank on the full score
const word=v=>v>=65?'Good':v>=40?'Maybe':'Poor';

function dial(s,wd,ws,size=52){
  const c=size/2,r=c-3;let wedges='';
  if(s.dirs)s.dirs.forEach((v,i)=>{if(!v)return;const a0=rad(i*22.5-11.25-90),a1=rad(i*22.5+11.25-90);
    wedges+=`<path d="M${c},${c} L${c+r*Math.cos(a0)},${c+r*Math.sin(a0)} A${r},${r} 0 0 1 ${c+r*Math.cos(a1)},${c+r*Math.sin(a1)} Z" fill="var(${v===2?'--sector2':'--sector'})" opacity="${v===2?0.9:0.75}"/>`});
  let arrow='';
  if(wd!=null){const L=r-4,a=rad(wd-90),tx=c+L*Math.cos(a),ty=c+L*Math.sin(a),hx=c-L*0.55*Math.cos(a),hy=c-L*0.55*Math.sin(a);
    const pa=rad(wd-90+180),b1=rad(wd-90+180+28),b2=rad(wd-90+180-28),k=7;
    arrow=`<line x1="${tx}" y1="${ty}" x2="${hx}" y2="${hy}" stroke="var(--arrow)" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M${hx+Math.cos(pa)*2},${hy+Math.sin(pa)*2} L${hx-k*Math.cos(b1)},${hy-k*Math.sin(b1)} L${hx-k*Math.cos(b2)},${hy-k*Math.sin(b2)} Z" fill="var(--arrow)"/>`}
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="Launch faces ${esc(dirsText(s.dirs))}; wind ${wd!=null?dirName(wd):''}">
    <circle cx="${c}" cy="${c}" r="${r}" fill="var(--dialbg)" stroke="var(--line)"/>${wedges}
    <text x="${c}" y="9" text-anchor="middle" font-size="7" fill="var(--muted)" font-family="Nunito Sans">N</text>${arrow}</svg>`;
}
function strip(day){
  const cells=[];for(let hr=8;hr<=19;hr++){const r=day.rows.find(x=>x.hr===hr);cells.push(`<i class="${r?cls(r.scores[day.type]):''}" title="${hourLabel(hr)}"></i>`)}
  const hrs=[];for(let hr=8;hr<=19;hr++){const n=hr>12?hr-12:hr;hrs.push(hr===12?'<b>12</b>':`<span>${n}${hr===8?'a':hr===13?'p':''}</span>`)}
  return `<div class="strip" aria-hidden="true">${cells.join('')}</div><div class="striphours" aria-hidden="true">${hrs.join('')}</div>`;
}
const windMult=s=>{const o=overrides[s.id];return (o&&o.windMult)||1};
const adjTag=s=>{const m=windMult(s);return m===1?'':`<span class="adj" title="Your site adjustment">${m>1?'+':'\u2212'}${Math.round(Math.abs(m-1)*100)}% your adjustment</span>`};
const star=s=>windMult(s)===1?'':'<span class="star">*</span>';
function facts(s,day){
  const p=day.peak;const f=[`<span>${U.spd(p.ws)}${star(s)} ${dirName(p.wd)}${p.gust-p.ws>10?`, gusts ${U.spd(p.gust)}${star(s)}`:''}</span>`];
  if(day.type==='thermal'||p.climb>0.5)f.push(`<span>top ${U.altN(p.top)}</span>`,`<span>${p.climb>=0.1?U.climb(p.climb)+' climbs':'weak lift'}</span>`);
  f.push(`<span>${U.dist(s.km)} away</span>`);return f.join('');
}

function render(){
  const main=$('#main');
  const days=$('#days');
  days.innerHTML=DAYKEYS.map((d,i)=>{const dt=new Date(d+'T12:00');const lbl=i===0?'Today':i===1?'Tomorrow':dt.toLocaleDateString(undefined,{weekday:'short'});
    return `<button class="day" aria-pressed="${d===curDay}" data-day="${d}">${lbl}</button>`}).join('');
  if(!SITES.length){main.innerHTML=`<div class="status"><h2>No sites found</h2><p>Nothing within ${U.dist(settings.radiusKm)}. Try a bigger radius or another place.</p><div class="actions"><button class="btn primary" data-open-settings>Change location or radius</button></div></div>`;return}
  const ranked=SITES.filter(s=>s.days&&s.days[curDay]).sort((a,b)=>b.days[curDay].score-a.days[curDay].score);
  let html='';
  ranked.forEach((s,idx)=>{
    const d=s.days[curDay],p=d.peak;const win=d.win?`${hourLabel(d.win[0])}–${hourLabel(d.win[1])}`:'No good window';
    if(idx===0){
      const R=reasons(s,d);
      html+=`<button class="site best" data-id="${esc(s.id)}">
        <div>${dial(s,p.wd,p.ws,72)}</div>
        <div><div class="name">${esc(s.name)}</div><div class="sub">${TYPE_LABEL[d.type]}, ${win}${adjTag(s)}</div></div>
        <div class="score ${cls(d.score)}">${disp(d.score)}<small>${word(d.score)}</small></div>
        <p class="why">${esc(R.out[0])}</p>
        <div class="facts" style="grid-column:1/4">${facts(s,d)}</div>
        <div class="strip-wrap" style="grid-column:1/4">${strip(d)}</div></button>`;
      if(ranked.length>1)html+=`<div class="section">Other sites</div>`;
    }else{
      html+=`<button class="site" data-id="${esc(s.id)}">
        <div>${dial(s,p.wd,p.ws)}</div>
        <div><div class="name">${esc(s.name)}</div><div class="sub">${TYPE_LABEL[d.type]}, ${win}${adjTag(s)}</div></div>
        <div class="score ${cls(d.score)}">${disp(d.score)}<small>${word(d.score)}</small></div>
        <div class="facts">${facts(s,d)}</div>
        <div style="grid-column:2/4">${strip(d)}</div></button>`;
    }
  });
  main.innerHTML=html;
}

/* ---------- sounding + pilot panels in the detail view ---------- */
const toDisplayT=c=>settings.units==='us'?c*9/5+32:c;
const tUnit=()=>settings.units==='us'?'°F':'°C';
const altToUser=m=>settings.units==='us'?m*FT_PER_M:m;
const userToAlt=v=>settings.units==='us'?v/FT_PER_M:v;
function sndRange(s,r){const alt=s.alt||0;const zTop=Math.max(r.top+1000,alt+2200);const maxZ=r.snd[r.snd.length-1].z;return [alt,Math.min(zTop,maxZ)]}
function windAtZ(r,z){const u=interp(r.snd,z,'u'),v=interp(r.snd,z,'v');return fromUV(u,v)}
function parcelT(r,z,alt){const base=r.T2+r.trig;const zl=Math.min(r.lcl,z);let T=base-0.0098*(zl-alt);if(z>r.lcl)T-=0.006*(z-r.lcl);return T}
function soundingSVG(s,r){
  /* plot area roughly square, like standard soundings */ const W=340,H=290,L=46,R=74,T=12,B=30;const [z0,z1]=sndRange(s,r);const alt=s.alt||0;
  const pts=r.snd.filter(p=>p.z<=z1+1);
  const temps=[];pts.forEach(p=>{temps.push(p.T);if(p.Td!=null)temps.push(p.Td)});temps.push(parcelT(r,z0,alt),parcelT(r,z1,alt));
  let tMin=toDisplayT(Math.min(...temps)),tMax=toDisplayT(Math.max(...temps));const step=settings.units==='us'?10:5;
  tMin=Math.floor(tMin/step)*step-step;tMax=Math.ceil(tMax/step)*step;
  const X=c=>L+(toDisplayT(c)-tMin)/(tMax-tMin)*(W-L-R),Y=z=>T+(1-(z-z0)/(z1-z0))*(H-T-B);
  let g='';
  // altitude grid
  const zs=settings.units==='us'?1000/FT_PER_M:300;
  for(let z=Math.ceil(z0/zs)*zs;z<=z1;z+=zs){g+=`<line x1="${L}" x2="${W-R}" y1="${Y(z)}" y2="${Y(z)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(z)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${settings.units==='us'?Math.round(altToUser(z)/1000)+'k':Math.round(z)}</text>`}
  for(let t=tMin;t<=tMax;t+=step){const x=L+(t-tMin)/(tMax-tMin)*(W-L-R);g+=`<line x1="${x}" x2="${x}" y1="${T}" y2="${H-B}" stroke="var(--line)" stroke-dasharray="2 4"/><text x="${x}" y="${H-B+14}" text-anchor="middle" font-size="10" fill="var(--muted)">${t}°</text>`}
  // lift band
  if(r.depth>100)g+=`<rect x="${L}" y="${Y(r.top)}" width="${W-L-R}" height="${Y(z0)-Y(r.top)}" fill="var(--good)" opacity=".09"/><line x1="${L}" x2="${W-R}" y1="${Y(r.top)}" y2="${Y(r.top)}" stroke="var(--good)" stroke-width="1.5"/><text x="${L+4}" y="${Y(r.top)-4}" font-size="10" fill="var(--good)">top of lift ${U.altN(r.top)}</text>`;
  const ul=usableTop(s,r);
  if(ul&&ul<r.top-30)g+=`<line x1="${L}" x2="${W-R}" y1="${Y(ul)}" y2="${Y(ul)}" stroke="var(--good)" stroke-width="1.3" stroke-dasharray="3 3"/><text x="${L+4}" y="${Math.abs(Y(ul)-Y(r.top))<14?Y(ul)+12:Y(ul)-4}" font-size="10" fill="var(--good)">usable lift ${U.altN(ul)}</text>`;
  if(r.cu&&r.lcl<z1)g+=`<line x1="${L}" x2="${W-R}" y1="${Y(r.lcl)}" y2="${Y(r.lcl)}" stroke="var(--ink)" stroke-dasharray="5 4" opacity=".7"/><text x="${W-R-4}" y="${Math.abs(Y(r.lcl)-Y(r.top))<16?Y(r.lcl)+12:Y(r.lcl)-4}" text-anchor="end" font-size="10" fill="var(--ink)" opacity=".8">cloudbase ${U.altN(r.lcl)}</text>`;
  // parcel path
  let pp='';for(let z=z0;z<=z1;z+=25)pp+=`${pp?'L':'M'}${X(parcelT(r,z,alt)).toFixed(1)},${Y(z).toFixed(1)}`;
  g+=`<path d="${pp}" fill="none" stroke="var(--gold)" stroke-width="1.6" stroke-dasharray="5 3"/>`;
  const line=(key,col)=>{const q=pts.filter(p=>p[key]!=null);if(q.length<2)return '';return `<path d="${q.map((p,i)=>`${i?'L':'M'}${X(p[key]).toFixed(1)},${Y(p.z).toFixed(1)}`).join('')}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linejoin="round"/>`};
  g+=line('Td','var(--cyan)')+line('T','var(--coral)');
  // wind column
  for(let z=Math.ceil(z0/zs)*zs;z<=z1;z+=zs){const w=windAtZ(r,z);const cx=W-R+16,cy=Y(z),a=rad(w.d-90),k=8;
    const x1=cx+k*Math.cos(a),y1=cy+k*Math.sin(a),x2=cx-k*Math.cos(a),y2=cy-k*Math.sin(a);
    g+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--arrow)" stroke-width="2" stroke-linecap="round"/><circle cx="${x2}" cy="${y2}" r="2.2" fill="var(--arrow)"/><text x="${cx+13}" y="${cy+4}" font-size="10" fill="var(--ink)">${Math.round(settings.units==='us'?w.s/KMH_PER_MPH:w.s)}</text>`}
  g+=`<text x="${W-R+16}" y="${T+2}" text-anchor="middle" font-size="9" fill="var(--muted)">${settings.units==='us'?'mph':'km/h'}</text>`;
  g+=`<text x="${L}" y="${H-4}" font-size="10" fill="var(--muted)">temperature ${tUnit()}</text><text x="6" y="${T+8}" font-size="9" fill="var(--muted)">${settings.units==='us'?'ft':'m'}</text>`;
  return `<svg class="snd" viewBox="0 0 ${W} ${H}" role="img" aria-label="Forecast sounding at ${hourLabel(r.hr)}">${g}</svg>
    <p class="hint"><span style="color:var(--coral)">━</span> air temperature &nbsp; <span style="color:var(--cyan)">━</span> dewpoint &nbsp; <span style="color:var(--gold)">┅</span> rising thermal &nbsp; <span style="color:var(--good)">▮</span> lift band, <span style="color:var(--good)">┄</span> top of usable lift. Arrows show wind direction (dot is where it\u2019s blowing to).</p>`;
}
// top of usable lift: highest point where the estimated climb is still about 200 fpm (1 m/s)
function usableTop(s,r){if(r.depth<150||r.climb<1)return null;const x=1-0.25/r.climb;return (s.alt||0)+r.depth*clamp(x,0,1)}
function instability(s,r){
  const alt=s.alt||0;const z2=alt+900;const lr=(interp(r.snd,alt,'T')-interp(r.snd,z2,'T'))/0.9; // °C per km in the first ~3,000 ft
  const lvl=lr>=8.5?{w:'Very unstable',c:'g',d:'Close to the dry rate (9.8°C/km): thermals rise easily and can be strong, punchy or rough.'}
    :lr>=7?{w:'Unstable',c:'g',d:'Good thermal air: climbs should be steady and workable.'}
    :lr>=5?{w:'Slightly stable',c:'m',d:'Thermals struggle against the air around them, so expect weak, narrow climbs.'}
    :lr>=2?{w:'Stable',c:'p',d:'Little thermal activity; mostly a ridge-soaring or sled-ride day.'}

function liftShape(x){return x<0.12?0.4+5*x:x<0.75?1:Math.max(0,(1-x)/0.25)}

  const x=(z-alt)/Math.max(1,r.depth);const climb=inBand?r.climb*liftShape(x):0;

    <div><b>${inBand?(climb>0.05?U.climb(climb):'weak'):'none'}</b><span>${inBand?'est. climb here':'above top of lift'}</span></div>
    <div><b>${Math.round(toDisplayT(Tz))}${tUnit()}</b><span>air temperature</span></div>
    <div><b>${spread>0?'+':''}${(settings.units==='us'?spread*1.8:spread).toFixed(1)}${tUnit()}</b><span>thermal vs. air (positive = still rising)</span></div>`;
}
function bsrInfo(r){const v=r.bsr;if(!v)return{txt:'n/a',c:'',word:'No usable thermals'};
  return v>=7?{txt:v.toFixed(0),c:'g',word:'Thermals hold together'}:v>=5?{txt:v.toFixed(0),c:'m',word:'Some broken, ragged thermals'}:{txt:v.toFixed(1),c:'p',word:'Wind likely tears thermals apart'}}
function xcInfo(s,d){
  const rows=d.rows.map(r=>({r,t:scoreHour('thermal',s,r).score}));const best=rows.reduce((a,b)=>(b.t>a.t||(b.t===a.t&&b.r.depth>a.r.depth))?b:a,rows[0]);const r=best.r;
  const why=[];
  const good=best.t>=65&&r.depth>=900&&r.bsr>=5&&r.aloft.s<30;
  const ok=best.t>=40&&r.depth>=500;
  why.push(`Lift tops out near ${U.altN(r.top)}, ${U.altN(r.depth)} over launch${r.depth>=900?', enough to leave':r.depth>=500?', marginal for going far':', too low to go anywhere'}.`);
  why.push(`Wind at the top of lift ${U.spd(r.aloft.s)} ${dirName(r.aloft.d)}${r.aloft.s>=30?', strong enough to blow you over the back or break up climbs':r.aloft.s>=18?', a good tailwind if it lines up with your route':', light'}.`);
  if(r.bsr)why.push(`Buoyancy-to-shear ${bsrInfo(r).txt}: ${bsrInfo(r).word.toLowerCase()}.`);
  if(r.cu)why.push(`Cumulus marking thermals, base near ${U.altN(r.lcl)}.`);
  return {level:good?'Good':ok?'Possible':'Poor',c:good?'g':ok?'m':'p',why,hr:r.hr};
}

/* trigger temperature from the morning sounding */
function triggerInfo(s,d){
  const alt=s.alt||0;const m=d.rows.find(r=>r.hr>=7)||d.rows[0];if(!m)return null;
  const env=z=>interp(m.snd,z,'T');
  // convective temperature: surface temperature at which a dry thermal reaches its condensation level
  let tcon=null;for(let T=m.T2;T<=m.T2+25;T+=0.1){const zl=alt+125*Math.max(0,T-m.Td);const Tp=T-0.0098*(zl-alt);if(Tp>=env(zl)){tcon=T;break}}
  const zt=alt+1000;const need=env(zt)+0.0098*(zt-alt); // to reach ~3,300 ft above launch
  const hi=d.rows.reduce((a,b)=>b.T2>a.T2?b:a,d.rows[0]);
  const when=T=>{const r=d.rows.find(x=>x.T2>=T-0.3);return r?hourLabel(r.hr):null};
  return {tcon,need,hi,whenNeed:when(need),whenCon:tcon!=null?when(tcon):null,morning:m};
}
function cloudInfo(d,r){
  const cuHours=d.rows.filter(x=>x.cu&&x.depth>150);
  const cape=Math.max(...d.rows.map(x=>x.cape)),li=Math.min(...d.rows.map(x=>x.li)),pp=Math.max(...d.rows.map(x=>x.pp));
  const od=(cape>800||li<-3)?{w:'High',c:'p'}:(cape>300||li<-1||pp>=40)?{w:'Moderate',c:'m'}:(cape>50&&cuHours.length)?{w:'Low',c:'g'}:{w:'None',c:'g'};
  return {cuHours,cape,li,pp,od};
}
function windShiftInfo(s,d){
  const rows=d.rows;if(rows.length<4)return null;
  const base=rows.slice(0,2);const u=base.reduce((a,r)=>a+toUV(r.ws,r.wd).u,0),v=base.reduce((a,r)=>a+toUV(r.ws,r.wd).v,0);const b=fromUV(u/2,v/2);
  for(let k=2;k<rows.length-1;k++){const r=rows[k],n=rows[k+1];
    const turned=angDiff(r.wd,b.d)>=60&&angDiff(n.wd,b.d)>=60;const up=r.ws>=b.s+8&&n.ws>=b.s+6;
    if((turned&&r.ws>=10)||up)return {hr:r.hr,from:b,to:r};}
  return {hr:null,from:b};
}

function fogInfo(d,r){
  const sp=c=>settings.units==='us'?c*1.8:c, u=settings.units==='us'?'°F':'°C';
  const spread=Math.max(0,r.T2-r.Td);
  const lvl=spread<=1.1?{w:'High',c:'p'}:spread<=2.2?{w:'Moderate',c:'m'}:{w:'Low',c:'g'};
  const risky=d.rows.filter(x=>x.T2-x.Td<=2.2);
  return {spread,lvl,risky,fmt:c=>Math.round(sp(c))+u};
}
function renderPilotData(s,d,r){
  const [z0,z1]=sndRange(s,r);const lo=Math.round(altToUser(z0)/100)*100,hi=Math.round(altToUser(z1)/100)*100;
  const start=Math.round(altToUser(Math.min(z1,(s.alt||0)+r.depth*0.6||z0))/100)*100;
  const B=bsrInfo(r),XC=xcInfo(s,d),I=instability(s,r),TR=triggerInfo(s,d),CL=cloudInfo(d,r),WS=windShiftInfo(s,d),FG=fogInfo(d,r);
  const tF=c=>Math.round(toDisplayT(c))+tUnit();
  $('#snd').innerHTML=`<div class="panel"><h3>Sounding, ${hourLabel(r.hr)}</h3><p class="hint">Tap any hour in the table to see its sounding.</p>${soundingSVG(s,r)}</div>
  <details class="xc" open><summary>Winds and lift by altitude</summary><div class="in">
    <div class="altrow"><input type="range" id="altR" min="${lo}" max="${hi}" step="100" value="${start}" aria-label="Altitude"><input type="number" id="altN" min="${lo}" max="${hi}" step="100" value="${start}" aria-label="Altitude in ${settings.units==='us'?'feet':'metres'}"></div>
    <div class="readout" id="altOut">${altReadout(s,r,userToAlt(start))}</div>
    <p class="what">Drag or type an altitude (${settings.units==='us'?'feet':'metres'} above sea level) to see the forecast wind and lift there at ${hourLabel(r.hr)}. Wind that turns or gets much stronger above launch can make the air rough, and \u201cthermal vs. air\u201d shows how much warmer a rising thermal is than the air around it: the bigger the number, the stronger it keeps climbing, and once it reaches zero the climb stops.</p></div></details>
  <details class="xc"><summary>Instability and lapse rate <span class="val ${I.c}">${settings.units==='us'?(I.lr*0.5486).toFixed(1)+'°F/1k ft':I.lr.toFixed(1)+'°C/km'}</span></summary><div class="in">
    <p style="margin:0 0 6px"><strong class="${I.c}">${I.w}.</strong></p>
    <p style="margin:0">Air ${I.lr>=0?'cools':'warms'} about ${settings.units==='us'?Math.abs(I.lr*0.5486).toFixed(1)+'°F per 1,000 ft':Math.abs(I.lr).toFixed(1)+'°C per km'} in the first 3,000 ft above launch at ${hourLabel(r.hr)}. ${esc(I.d)}${r.cape>500?` CAPE is ${Math.round(r.cape)} J/kg, so clouds could grow tall: watch for overdevelopment.`:''}</p>
    <p style="margin:6px 0 0">${usableTop(s,r)?`Top of usable lift is about ${U.altN(usableTop(s,r))}, with thermals topping out near ${U.altN(r.top)}.`:r.depth>150?`Climbs look too weak (under 200 fpm) for much usable lift, even though thermals reach about ${U.altN(r.top)}.`:'No usable lift above launch.'}</p>
    <p class="what">Instability is how quickly the air cools as you go up. A rising thermal cools at a fixed rate (about ${settings.units==='us'?'5.4°F per 1,000 ft':'9.8°C per km'}); when the surrounding air cools nearly that fast, the thermal stays warmer than its surroundings and keeps rising, which is what powers good climbs. When the air cools slowly, or warms with height (an inversion), thermals lose their push and stall. Top of usable lift is where climbs drop below about 200 fpm, usually a bit below the very top of the thermals, and is the practical ceiling for planning glides.</p></div></details>
  ${TR?`<details class="xc"><summary>Trigger temperature <span class="val ${TR.tcon!=null?'':'p'}">${TR.tcon!=null?tF(TR.tcon):'too stable'}</span></summary><div class="in">
    <p style="margin:0 0 6px">${TR.tcon!=null?`Once the ground air reaches about ${tF(TR.tcon)}, thermals should rise all the way to cloudbase and start building cumulus${TR.whenCon?`, forecast around ${TR.whenCon}`:`, which the forecast high of ${tF(TR.hi.T2)} doesn\u2019t reach, so expect blue thermals`}.`:'Too stable today: even a very warm afternoon wouldn\u2019t push thermals up to cloud level.'}</p>
    <p style="margin:0 0 6px">To reach about ${U.altN(TR.morning?((s.alt||0)+1000):0)} (3,300 ft over launch) it needs roughly ${tF(TR.need)}${TR.whenNeed?`, forecast around ${TR.whenNeed}`:', which it doesn\u2019t reach today'}. Forecast high ${tF(TR.hi.T2)} around ${hourLabel(TR.hi.hr)}.</p>
    <p class="what">Thermals only start once the sun heats the ground air enough to be warmer than the air above it. The trigger temperature (\u201ctcon\u201d on Windy and other soundings) is the surface temperature needed for thermals to climb all the way to cloud level. Comparing it with the forecast temperature tells you roughly when the day will \u201cturn on\u201d, which is why pilots often wait on launch until it\u2019s warm enough. It\u2019s worked out from the ${hourLabel(TR.morning.hr)} forecast sounding.</p></div></details>`:''}
  <details class="xc"><summary>Buoyancy-to-shear ratio <span class="val ${B.c}">${B.txt}</span></summary><div class="in">
    <p style="margin:0">${esc(B.word)} at ${hourLabel(r.hr)}. Thermal strength about ${(r.wstar*196.85/10|0)*10} fpm versus a wind change of ${U.spd(r.shear*3.6)} between launch and the top of lift.</p>
    <p class="what">Thermals are columns of rising air, and wind that changes speed or direction with height (shear) tilts and shreds them. This ratio compares how strong the thermals are with how much shear they face. About 7 or more usually means smooth, consolidated climbs; 5 to 7 means workable but ragged; under 5 means the wind tends to rip thermals apart, so climbs feel turbulent and hard to center. It works on the same idea as XC Skies\u2019 version, though the numbers won\u2019t match theirs exactly.</p></div></details>
  <details class="xc"><summary>Clouds and overdevelopment <span class="val ${CL.od.c}">${CL.cuHours.length?'Cu':'Blue'}, OD ${CL.od.w.toLowerCase()}</span></summary><div class="in">
    <p style="margin:0 0 6px">${CL.cuHours.length?`Cumulus likely from about ${hourLabel(CL.cuHours[0].hr)} to ${hourLabel(CL.cuHours[CL.cuHours.length-1].hr+1)}, with bases near ${U.altN(Math.min(...CL.cuHours.map(x=>x.lcl)))} to ${U.altN(Math.max(...CL.cuHours.map(x=>x.lcl)))}.`:'Thermals probably stay blue (no cumulus), so you\u2019ll have to find them without clouds marking the way.'}</p>
    <p style="margin:0 0 6px">Overdevelopment risk ${CL.od.w.toLowerCase()}: peak CAPE ${Math.round(CL.cape)} J/kg${CL.pp?`, up to ${CL.pp}% chance of rain`:''}.</p>
    <p class="what">Cumulus clouds form when thermals rise high enough to condense, so they act like signposts for lift and their base is often the practical ceiling. Overdevelopment (OD) is when those clouds keep growing into towering cumulus or thunderstorms, bringing strong gust fronts, cloud suck and rain. CAPE measures the energy available for that growth: under about 300 is usually fine, 300 to 800 means watch the sky, and over 800 means storms are a real risk.</p></div></details>
  <details class="xc"><summary>Fog and low clouds (T\u2013Td) <span class="val ${FG.lvl.c}">${FG.fmt(FG.spread)}</span></summary><div class="in">
    <p style="margin:0 0 6px"><strong class="${FG.lvl.c}">${FG.lvl.w} risk</strong> at ${hourLabel(r.hr)}: temperature ${tF(r.T2)}, dewpoint ${tF(r.Td)}, a gap of ${FG.fmt(FG.spread)}.</p>
    <p style="margin:0 0 6px">${FG.risky.length?`The gap is ${settings.units==='us'?'4°F':'2°C'} or less around ${FG.risky.length>3?`${hourLabel(FG.risky[0].hr)} to ${hourLabel(FG.risky[FG.risky.length-1].hr+1)}`:FG.risky.map(x=>hourLabel(x.hr)).join(', ')}, so watch for fog or low cloud at launch then.`:'No hours today with a gap small enough for fog at launch.'}</p>
    <p class="what">T\u2013Td is the gap between the air temperature and the dewpoint (the temperature at which moisture condenses). The smaller the gap, the closer the air is to forming cloud right where you are: about ${settings.units==='us'?'2°F':'1°C'} or less often means fog or a low stratus deck, up to ${settings.units==='us'?'4°F':'2°C'} means it\u2019s possible, especially at coastal sites and on marine-layer mornings. A bigger gap also means a higher cloudbase, roughly ${settings.units==='us'?'230 ft for every 1°F':'125 m for every 1°C'} of gap. This uses the forecast at launch height, so fog sitting in the valley below can still happen when this reads low.</p></div></details>
  ${WS?`<details class="xc"><summary>Wind shift and sea breeze <span class="val ${WS.hr?'m':'g'}">${WS.hr?`around ${hourLabel(WS.hr)}`:'none expected'}</span></summary><div class="in">
    <p style="margin:0 0 6px">${WS.hr?`Morning wind about ${U.spd(WS.from.s)} ${dirName(WS.from.d)} changes to ${U.spd(WS.to.ws)} ${dirName(WS.to.wd)} around ${hourLabel(WS.hr)}.`:`Wind stays fairly steady near ${U.spd(WS.from.s)} ${dirName(WS.from.d)} through the day, with no strong shift forecast.`}</p>
    <p class="what">In coastal areas like the Bay, the cooler ocean air (sea breeze) pushes inland during the afternoon, usually as a clear shift in direction and a jump in speed. Where it meets warmer inland air it can create a line of lift (a convergence line), but behind it the air is cool and stable, so thermals often shut down and launches can get blown out. Knowing when it arrives helps you plan when to launch and when to be on the ground. This is a simple read of the hourly wind at this launch, not a map of the convergence line.</p></div></details>`:''}
  <details class="xc"><summary>XC potential <span class="val ${XC.c}">${XC.level}</span></summary><div class="in">
    <p style="margin:0 0 6px">Best thermal hour around ${hourLabel(XC.hr)}.</p>${XC.why.map(w=>`<p style="margin:0 0 6px">${esc(w)}</p>`).join('')}
    <p class="what">A quick read on whether this is a day to go cross-country rather than just fly locally. It rates the whole day as Good, Possible or Poor from top of lift, wind at altitude and buoyancy-to-shear. When we replayed two years of archived forecasts, days rated well here lined up with most of the logged XC days at Ed Levin and Blue Rock, but always read the sounding yourself and check with local pilots.</p></div></details>`;

      <dt>Launch</dt><dd>${U.altN(s.alt||0)}, ${U.dist(s.km)} away</dd>
      <dt>Good winds</dt><dd>${esc(dirsText(s.dirs))}${s.dirSrc?` <span class="small">(${esc(s.dirSrc)})</span>`:''}</dd>
      <dt>Flying types</dt><dd>${s.types.map(t=>TYPE_LABEL[t]).join(', ')}</dd>
      ${s.req?`<dt>Requirements</dt><dd>${esc(s.req)}</dd>`:''}
      ${s.note?`<dt>Notes</dt><dd>${esc(s.note)}</dd>`:''}
      ${s.userNote?`<dt>Your note</dt><dd>${esc(s.userNote)}</dd>`:''}
      <dt>Source</dt><dd>${esc(s.source)}</dd>
    </dl>
    <p class="small">Always check live wind, the site guide and local pilots before flying. This is a model-based estimate.</p>
    <button class="btn primary" id="editBtn">Edit this site</button>`;
  $('#editBtn').onclick=()=>showEditor(s);
  renderPilotData(s,d,d.peak);
  $('#hrRows').onclick=e=>{const tr=e.target.closest('tr[data-hr]');if(!tr)return;const r=d.rows.find(x=>x.hr==tr.dataset.hr);
    $('#hrRows').querySelectorAll('tr').forEach(x=>x.classList.toggle('sel',x===tr));renderPilotData(s,d,r)};
  openSheet('#detail');$('#detail').scrollTop=0;
}

function showEditor(s){
  const o=overrides[s.id]||{};
  let arr=(o.dirs||s.dirs||new Array(16).fill(0)).slice();let types=(o.types||s.types).slice();
  const body=$('#eBody');$('#eTitle').textContent='Edit '+s.name;
  const draw=()=>{
    body.innerHTML=`<p class="small">Tap a direction to cycle: off, workable, good. Saved on this phone right away.</p>
      <div class="compass">${DIRS.map((d,i)=>`<button data-i="${i}" data-r="${arr[i]}" aria-label="${d} ${['off','workable','good'][arr[i]]}">${d}</button>`).join('')}</div>
      <div class="chips" style="margin:14px 0">${['thermal','ridge','coastal'].map(t=>`<button class="chip" data-t="${t}" aria-pressed="${types.includes(t)}">${TYPE_LABEL[t]}</button>`).join('')}</div>
      <label class="field"><span>Your wind adjustment for this site</span><select id="eMult">${[[0.7,'30% lighter than forecast'],[0.8,'20% lighter than forecast'],[0.9,'10% lighter than forecast'],[1,'No adjustment (standard forecast)'],[1.1,'10% stronger than forecast'],[1.2,'20% stronger than forecast'],[1.3,'30% stronger than forecast'],[1.4,'40% stronger than forecast'],[1.5,'50% stronger than forecast'],[1.6,'60% stronger than forecast']].map(([v,l])=>`<option value="${v}" ${(o.windMult||1)==v?'selected':''}>${l}</option>`).join('')}</select></label>
      <p class="small" style="margin:-6px 0 8px">If set, this site\u2019s wind, gusts, score and ranking use your adjusted numbers on this phone, clearly marked, and the original forecast stays available on its detail page.</p>
      <label class="field"><span>Your note</span><input type="text" id="eNote" value="${esc(o.note||'')}"></label>
      <label class="field" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="eHide" ${o.hidden?'checked':''}> Hide this site</label>
      <div class="status actions" style="padding:0"><button class="btn primary" id="eSave">Save changes</button><button class="btn" id="eReset">Reset to original</button></div>`;
    body.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;arr[i]=(arr[i]+1)%3;draw()});
    body.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const t=b.dataset.t;types=types.includes(t)?types.filter(x=>x!==t):types.concat(t);if(!types.length)types=[t];draw()});
    $('#eSave').onclick=()=>{overrides[s.id]={name:s.name,dirs:arr.some(x=>x)?arr:null,types,note:$('#eNote').value.trim(),hidden:$('#eHide').checked,windMult:+$('#eMult').value};
      if(overrides[s.id].windMult===1)delete overrides[s.id].windMult;
      if(!overrides[s.id].dirs)delete overrides[s.id].dirs;store.set('overrides',overrides);toast('Saved');closeSheet($('#editor'));closeSheet($('#detail'));load(false)};
    $('#eReset').onclick=()=>{delete overrides[s.id];store.set('overrides',overrides);toast('Reset');closeSheet($('#editor'));closeSheet($('#detail'));load(false)};
  };
  draw();openSheet('#editor');
}

function showSettings(){
  const b=$('#sBody');
  const st=Object.entries(sourceStatus).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('');
  b.innerHTML=`
    <label class="field"><span>Location: town, city, or coordinates</span><input type="text" id="placeQ" placeholder="Bishop, CA  or  37.4754, -121.8613" autocomplete="off" enterkeyhint="search"></label>
    <div class="results" id="placeR"></div>
    <button class="locbtn" id="gpsBtn" style="margin:2px 0 6px">Use my current location</button>
    <label class="field"><span>Search radius</span><select id="radius">${(()=>{const us=settings.units==='us';const opts=(us?[25,50,75,100,150,200]:[40,80,120,160,240,320]).map(v=>us?v*1.609344:v);
   const near=opts.reduce((a,b)=>Math.abs(b-settings.radiusKm)<Math.abs(a-settings.radiusKm)?b:a);
   return opts.map(k=>`<option value="${k}" ${k===near?'selected':''}>${U.dist(k)}</option>`).join('')})()}</select></label>
    <label class="field"><span>Units</span><select id="units"><option value="us" ${settings.units==='us'?'selected':''}>mph, feet, fpm</option><option value="metric" ${settings.units==='metric'?'selected':''}>km/h, metres, m/s</option></select></label>
    <label class="field"><span>Most sites to check</span><select id="maxS">${[25,45,70].map(k=>`<option ${k==settings.maxSites?'selected':''}>${k}</option>`).join('')}</select></label>
    <h3 class="section" style="padding-left:0">Data sources</h3>
    <dl>${st||'<dt>–</dt><dd>Not loaded yet</dd>'}<dt>Weather</dt><dd>Open-Meteo (HRRR and GFS models)</dd></dl>`;
  $('#gpsBtn').onclick=()=>{settings.loc=null;saveSettings();closeSheet($('#settings'));locate()};
  $('#placeQ').onkeydown=e=>{if(e.key==='Enter'){const f=$('#placeR').querySelector('button');if(f)f.click()}};
  let tmr;$('#placeQ').oninput=e=>{clearTimeout(tmr);const q=e.target.value.trim();if(q.length<2){$('#placeR').innerHTML='';return}
    const cm=q.match(/^\s*(-?\d{1,2}(?:\.\d+)?)\s*[,\s]\s*(-?\d{1,3}(?:\.\d+)?)\s*$/);
    if(cm&&Math.abs(+cm[1])<=90&&Math.abs(+cm[2])<=180){const la=+cm[1],lo=+cm[2];
      $('#placeR').innerHTML=`<button data-la="${la}" data-lo="${lo}" data-n="${la.toFixed(3)}, ${lo.toFixed(3)}">Use coordinates ${la.toFixed(4)}, ${lo.toFixed(4)}</button>`;
      $('#placeR').querySelector('button').onclick=()=>setLoc(la,lo,`${la.toFixed(3)}, ${lo.toFixed(3)}`);return}
    tmr=setTimeout(async()=>{try{const j=await fetchJSON(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=5`);
      $('#placeR').innerHTML=(j.results||[]).map(r=>`<button data-la="${r.latitude}" data-lo="${r.longitude}" data-n="${esc(r.name)}">${esc(r.name)}<span class="small">, ${esc([r.admin1,r.country].filter(Boolean).join(', '))}</span></button>`).join('')||'<p class="small">No matches.</p>';
      $('#placeR').querySelectorAll('button').forEach(x=>x.onclick=()=>setLoc(+x.dataset.la,+x.dataset.lo,x.dataset.n))}catch(err){$('#placeR').innerHTML='<p class="small">Search is unavailable right now.</p>'}},350)};
  $('#radius').onchange=e=>{settings.radiusKm=+e.target.value;saveSettings();load(false)};
  $('#units').onchange=e=>{settings.units=e.target.value;saveSettings();render();showSettings()};
  $('#maxS').onchange=e=>{settings.maxSites=+e.target.value;saveSettings();load(false)};
  openSheet('#settings');
}
function showAddSite(){
  $('#eTitle').textContent='Add a site';
  $('#eBody').innerHTML=`<label class="field"><span>Name</span><input type="text" id="aN"></label>
    <label class="field"><span>Launch latitude, longitude (copy from Google Maps)</span><input type="text" id="aLL" placeholder="37.4754, -121.8613"></label>
    <label class="field"><span>Good wind directions (e.g. SW, W, WNW)</span><input type="text" id="aD"></label>
    <div class="chips" id="aT">${['thermal','ridge','coastal'].map(t=>`<button class="chip" data-t="${t}" aria-pressed="false">${TYPE_LABEL[t]}</button>`).join('')}</div>
    <div class="status actions" style="padding:14px 0"><button class="btn primary" id="aSave">Add site</button></div>`;
  $('#aT').querySelectorAll('.chip').forEach(c=>c.onclick=()=>c.setAttribute('aria-pressed',c.getAttribute('aria-pressed')!=='true'));
  $('#aSave').onclick=()=>{const n=$('#aN').value.trim();const ll=$('#aLL').value.split(/[ ,]+/).map(Number);
    if(!n||ll.length<2||isNaN(ll[0])||isNaN(ll[1])){toast('Add a name and coordinates');return}
    const dirs=listToArr($('#aD').value.toUpperCase().split(/[^A-Z]+/).filter(Boolean));
    const types=[...$('#aT').querySelectorAll('[aria-pressed=true]')].map(c=>c.dataset.t);
    customSites.push({id:'u-'+slug(n)+'-'+Date.now().toString(36),name:n,lat:ll[0],lon:ll[1],alt:null,types:types.length?types:null,dirs,dirSrc:dirs?'your entry':null,note:'',req:'',url:'',source:'Added by you'});
    store.set('custom',customSites);toast('Site added');closeSheet($('#editor'));closeSheet($('#settings'));load(false)};
  openSheet('#editor');
}
function locButton(name){return `<button class="locbtn" id="locBtn" aria-label="Change location"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Near ${esc(name||'you')}</button>`}
document.addEventListener('click',e=>{if(e.target.closest('#locBtn')){showSettings();setTimeout(()=>$('#placeQ')&&$('#placeQ').focus(),280)}});
function setLoc(lat,lon,name){settings.loc={lat,lon,name};saveSettings();closeSheet($('#settings'));load(false)}

function locate(){
  if(settings.loc){load(false);return}
  $('#main').innerHTML=`<div class="status"><h2>Checking the sky</h2><p>Getting your location…</p></div>`;
  if(!navigator.geolocation){askLocation('This browser can\u2019t share your location.');return}
  navigator.geolocation.getCurrentPosition(p=>{settings.loc={lat:p.coords.latitude,lon:p.coords.longitude,name:'your location',gps:true};saveSettings();load(false)},
    ()=>askLocation('Location access is off.'),{timeout:10000,maximumAge:6e5});
}
function askLocation(msg){
  $('#main').innerHTML=`<div class="status"><h2>Where do you fly?</h2><p>${esc(msg)} Enter a town, city, or coordinates to rank the sites around it.</p>
  <div class="actions"><button class="btn primary" id="askLoc">Enter location</button></div></div>`;
  $('#askLoc').onclick=()=>{showSettings();setTimeout(()=>$('#placeQ')&&$('#placeQ').focus(),280)};
}

async function load(keepDay=true){
  if(loading)return;loading=true;
  const {lat,lon,name}=settings.loc;
  const main=$('#main');
  $('#where').innerHTML=`${locButton(name)}<span>${U.dist(settings.radiusKm)} radius</span>`;
  try{
    main.innerHTML=`<div class="status"><h2>Finding sites</h2><p>Checking club guides, BHGC, Paragliding Earth and OpenStreetMap…</p></div>`;
    SITES=await gatherSites(lat,lon,settings.radiusKm);
    if(SITES.length){
      main.innerHTML=`<div class="status"><h2>Reading the forecast</h2><p id="prog">Getting forecasts for ${SITES.length} sites…</p></div>`;
      await fetchWeather(SITES,(i,n)=>{const e=$('#prog');if(e)e.textContent=`Getting forecasts for ${n} sites (${i} done)…`});
      SITES.forEach(analyzeSite);
      DAYKEYS=Object.keys(SITES[0].days||{}).sort();
      if(!keepDay||!DAYKEYS.includes(curDay))curDay=DAYKEYS[0];
    }
    const now=new Date();
    $('#where').innerHTML=`${locButton(name)}<span>${U.dist(settings.radiusKm)} radius</span><span>${SITES.length} sites</span><span>Updated ${now.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}</span>`;
    render();
  }catch(e){
    console.error(e);
    main.innerHTML=`<div class="status"><h2>Forecast didn\u2019t load</h2><p>${esc(e.name==='AbortError'?'The weather service took too long to answer.':'The weather service couldn\u2019t be reached ('+e.message+').')} Check your connection and try again.</p><div class="actions"><button class="btn primary" id="retry">Try again</button></div></div>`;
    $('#retry').onclick=()=>load();
  }finally{loading=false}
}

$('#refreshBtn').onclick=()=>{if(settings.loc)load(true);else locate()};
$('#settingsBtn').onclick=showSettings;
locate();
</script>
</body>
</html>
